services:
  mysql:
    image: mysql:8.0
    container_name: snabplus-mysql-app
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: snabplus
      MYSQL_USER: snabplus
      MYSQL_PASSWORD: snabplus
    volumes:
      - snabplus_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: snabplus-app
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      APP_NAME: СнабПлюс
      APP_URL: http://45.83.23.104:8088
      APP_ENV: production
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: snabplus
      DB_USERNAME: snabplus
      DB_PASSWORD: snabplus
      DB_SETUP_USERNAME: root
      DB_SETUP_PASSWORD: root
      ADMIN_LOGIN: admin
      ADMIN_PASSWORD: Admin123!
      SESSION_NAME: snabplus_session
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/var/www/html/docker/entrypoint.sh"]

volumes:
  snabplus_mysql_data:
